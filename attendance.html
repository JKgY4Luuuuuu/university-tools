>

<title>
あと何回授業を休める？｜出席率計算
</title>

    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T0MYVWRDHL"></script>

<script>
  window.dataLayer = window.dataLayer || [];

  function gtag() {
    dataLayer.push(arguments);
  }

  gtag('js', new Date());

  gtag('config', 'G-T0MYVWRDHL');
</script>

<meta
  name="description"
  content="授業回数、必要出席率、現在の欠席回数から、あと何回授業を休めるか計算します。"
>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="site-header">

<div class="header-inner">

<h2 class="site-title">
<a href="index.html">
大学生向け計算ツール
</a>
</h2>

<nav class="nav">
<a href="final-exam.html">期末試験</a>
<a href="attendance.html">出席</a>
<a href="gpa-target.html">GPA</a>
<a href="credits-drop.html">落とせる単位</a>
<a href="credits-graduation.html">卒業単位</a>
</nav>

</div>

</header>


<main class="container">

<section class="card">

<h1>
あと何回授業を休める？
</h1>

<p class="description">
必要な出席率から、
あと何回欠席できるか計算します。
</p>

</section>


<section class="card">

<div class="field">

<label>
授業の総回数
</label>

<input
  id="totalClasses"
  type="number"
  value="15"
>

</div>


<div class="field">

<label>
必要な出席率（%）
</label>

<input
  id="requiredAttendance"
  type="number"
  value="67"
>

</div>


<div class="field">

<label>
現在の欠席回数
</label>

<input
  id="currentAbsences"
  type="number"
  value="2"
>

</div>


<button id="calculate">
あと何回休めるか計算
</button>

<div id="error" class="error"></div>

</section>


<section
  id="result"
  class="card result"
>

<h2>計算結果</h2>

<div
  id="resultMessage"
  class="result-main"
></div>

<div class="result-details">

<p>
必要出席回数：
<strong id="requiredCount"></strong>
</p>

<p>
最大欠席回数：
<strong id="maxAbsences"></strong>
</p>

</div>

</section>


<section class="card">

<h2>注意</h2>

<p class="notice">
大学によって、
欠席回数・遅刻・公欠などの扱いは異なります。
必ずシラバスを確認してください。
</p>

</section>


<section class="card tool-links">

<h2>関連ツール</h2>

<a href="final-exam.html">
期末試験で何点必要？
</a>

<a href="gpa-target.html">
目標GPAまであとどれくらい？
</a>

<a href="credits-drop.html">
あと何単位落とせる？
</a>

<a href="credits-graduation.html">
卒業まであと何単位？
</a>

</section>

</main>


<footer>
大学生向け計算ツール
</footer>


<script>

document
.getElementById("calculate")
.addEventListener(
  "click",
  calculateAttendance
);


function calculateAttendance() {

  const total =
    Number(
      document.getElementById("totalClasses").value
    );

  const rate =
    Number(
      document.getElementById("requiredAttendance").value
    );

  const absences =
    Number(
      document.getElementById("currentAbsences").value
    );

  const error =
    document.getElementById("error");

  error.textContent = "";


  if (
    total <= 0 ||
    rate < 0 ||
    rate > 100 ||
    absences < 0 ||
    absences > total
  ) {

    error.textContent =
      "入力内容を確認してください。";

    return;
  }


  const requiredCount =
    Math.ceil(
      total *
      rate /
      100
    );

  const maxAbsences =
    total -
    requiredCount;

  const remaining =
    maxAbsences -
    absences;


  const message =
    document.getElementById("resultMessage");

  message.className =
    "result-main";


  if (remaining > 0) {

    message.textContent =
      "あと " +
      remaining +
      "回 休めます";

    message.classList.add("success");

  }

  else if (remaining === 0) {

    message.textContent =
      "これ以上休めません";

    message.classList.add("warning");

  }

  else {

    message.textContent =
      "出席条件を下回っています";

    message.classList.add("danger");

  }


  document
    .getElementById("requiredCount")
    .textContent =
    requiredCount + "回";

  document
    .getElementById("maxAbsences")
    .textContent =
    maxAbsences + "回";

  document
    .getElementById("result")
    .style.display =
    "block";
}

</script>

</body>
</html>
