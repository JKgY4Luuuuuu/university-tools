<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
目標GPAまであとどれくらい？｜GPA逆算
</title>

    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-T0MYVWRDHL"></script>

<script>
  window.dataLayer = window.dataLayer || [];

  function gtag() {
    dataLayer.push(arguments);
  }

  gtag('js', new Date());

  gtag('config', 'G-T0MYVWRDHL');
</script>

<meta
  name="description"
  content="現在のGPAと取得済み単位から、目標GPA達成に必要な次学期GPAを計算します。"
>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="site-header">

<div class="header-inner">

<h2 class="site-title">
<a href="index.html">
大学生向け計算ツール
</a>
</h2>

<nav class="nav">
<a href="final-exam.html">期末試験</a>
<a href="attendance.html">出席</a>
<a href="gpa-target.html">GPA</a>
<a href="credits-drop.html">落とせる単位</a>
<a href="credits-graduation.html">卒業単位</a>
</nav>

</div>

</header>


<main class="container">

<section class="card">

<h1>
目標GPAまであとどれくらい？
</h1>

<p class="description">
目標GPAを達成するため、
次学期に必要なGPAを逆算します。
</p>

</section>


<section class="card">

<div class="field">

<label>現在のGPA</label>

<input
  id="currentGpa"
  type="number"
  value="2.20"
  step="0.01"
>

</div>


<div class="field">

<label>取得済み単位</label>

<input
  id="completedCredits"
  type="number"
  value="30"
>

</div>


<div class="field">

<label>次学期の履修単位</label>

<input
  id="nextCredits"
  type="number"
  value="20"
>

</div>


<div class="field">

<label>目標GPA</label>

<input
  id="targetGpa"
  type="number"
  value="2.50"
  step="0.01"
>

</div>


<div class="field">

<label>GPA最大値</label>

<input
  id="gpaMax"
  type="number"
  value="4.00"
  step="0.01"
>

</div>


<button id="calculate">
必要GPAを計算
</button>

<div id="error" class="error"></div>

</section>


<section
  id="result"
  class="card result"
>

<h2>計算結果</h2>

<div
  id="resultMessage"
  class="result-main"
></div>

<div class="result-details">

<p>
必要な次学期GPA：
<strong id="requiredGpa"></strong>
</p>

</div>

</section>


<section class="card">

<p class="notice">
大学によってGPAの計算方式は異なります。
所属大学の制度も確認してください。
</p>

</section>


<section class="card tool-links">

<h2>関連ツール</h2>

<a href="final-exam.html">
期末試験で何点必要？
</a>

<a href="attendance.html">
あと何回授業を休める？
</a>

<a href="credits-drop.html">
あと何単位落とせる？
</a>

<a href="credits-graduation.html">
卒業まであと何単位？
</a>

</section>

</main>


<footer>
大学生向け計算ツール
</footer>


<script>

document
.getElementById("calculate")
.addEventListener("click", calculate);


function calculate() {

  const current =
    Number(
      document.getElementById("currentGpa").value
    );

  const completed =
    Number(
      document.getElementById("completedCredits").value
    );

  const next =
    Number(
      document.getElementById("nextCredits").value
    );

  const target =
    Number(
      document.getElementById("targetGpa").value
    );

  const max =
    Number(
      document.getElementById("gpaMax").value
    );

  const error =
    document.getElementById("error");

  error.textContent = "";


  if (
    current < 0 ||
    completed < 0 ||
    next <= 0 ||
    target < 0 ||
    max <= 0 ||
    current > max ||
    target > max
  ) {

    error.textContent =
      "入力内容を確認してください。";

    return;
  }


  const totalCredits =
    completed + next;

  const required =
    (
      target * totalCredits -
      current * completed
    ) / next;


  const message =
    document.getElementById("resultMessage");

  message.className =
    "result-main";


  if (required <= 0) {

    message.textContent =
      "すでに目標GPA達成圏内です";

    message.classList.add("success");

  }

  else if (required > max) {

    message.textContent =
      "次学期だけでは達成できません";

    message.classList.add("danger");

  }

  else {

    message.textContent =
      "次学期にGPA " +
      required.toFixed(2) +
      " が必要です";

    message.classList.add("success");

  }


  document
    .getElementById("requiredGpa")
    .textContent =
    required.toFixed(2);


  document
    .getElementById("result")
    .style.display =
    "block";
}

</script>

</body>
</html>
