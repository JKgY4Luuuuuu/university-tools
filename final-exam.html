</title>

<meta
  name="description"
  content="小テストやレポートなどの現在の得点から、単位取得に必要な期末試験の点数を計算します。"
>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="site-header">

<div class="header-inner">

<h2 class="site-title">
<a href="index.html">

<nav class="nav">

<a href="credits-graduation.html">卒業単位</a>
</nav>

</div>

</header>

<main class="container">

<section class="card">

<h1>期末試験で何点必要？</h1>

<p class="description">
現在までの得点から、
単位取得に必要な期末試験の点数を計算します。
</p>

</section>


<section class="card">

<div class="field">

<label for="passScore">
合格に必要な総合点
</label>

<input
  id="passScore"
  type="number"
  value="60"
>

</div>


<div class="field">

<label>
現在までに獲得した点数
</label>

<input
  id="currentScore"
  type="number"
  value="36"
>

</div>


<div class="field">

<label>
期末試験の配点
</label>

<input
  id="finalMax"
  type="number"
  value="50"
>

</div>


<button id="calculate">
必要な点数を計算
</button>

<div id="error" class="error"></div>

</section>


<section
  id="result"
  class="card result"
>

<h2>計算結果</h2>

<div
  id="resultMessage"
  class="result-main"
></div>

<div class="result-details">

<p>
現在の得点：
<strong id="shownCurrent"></strong>
</p>

<p>
期末試験で必要：
<strong id="requiredScore"></strong>
</p>

<p>
必要得点率：
<strong id="requiredPercent"></strong>
</p>

</div>

</section>


<section class="card">

<h2>注意</h2>

<p class="notice">
実際の単位認定には、
出席条件や必須課題などが設定されている場合があります。
必ずシラバスも確認してください。
</p>

</section>


<section class="card tool-links">

<h2>関連ツール</h2>

<a href="attendance.html">
あと何回授業を休める？
</a>

<a href="gpa-target.html">

</a>

<a href="credits-drop.html">
あと何単位落とせる？
</a>

<a href="credits-graduation.html">
卒業まであと何単位？
</a>

</section>

</main>

    大学生向け計算ツール
  </p>

</footer>


<script>

document
.getElementById("calculate")
.addEventListener("click", calculate);


function calculate() {

  const pass =
    Number(
      document.getElementById("passScore").value
    );

  const current =
    Number(
      document.getElementById("currentScore").value
    );

  const finalMax =
    Number(
      document.getElementById("finalMax").value
    );

  const error =
    document.getElementById("error");

  error.textContent = "";


  if (
    !Number.isFinite(pass) ||
    !Number.isFinite(current) ||
    !Number.isFinite(finalMax) ||
    pass < 0 ||
    current < 0 ||
    finalMax <= 0
  ) {

    error.textContent =
      "正しい数値を入力してください。";

    return;
  }


  const required =
    pass - current;

  const result =
    document.getElementById("result");

  const message =
    document.getElementById("resultMessage");

  message.className =
    "result-main";


  document
    .getElementById("shownCurrent")
    .textContent =
    current + "点";


  if (required <= 0) {

    message.textContent =
      "すでに合格点に到達しています";

    message.classList.add("success");

    document
      .getElementById("requiredScore")
      .textContent = "0点";

    document
      .getElementById("requiredPercent")
      .textContent = "0%";

  }

  else if (required > finalMax) {

    message.textContent =
      "期末試験だけでは合格点に届きません";

    message.classList.add("danger");

    document
      .getElementById("requiredScore")
      .textContent =
      required + "点";

    document
      .getElementById("requiredPercent")
      .textContent =
      (
        required /
        finalMax *
        100
      ).toFixed(1) + "%";

  }

  else {

    const percent =
      required /
      finalMax *
      100;

    message.textContent =
      "期末試験で " +
      required +
      "点 必要です";

    message.classList.add("success");

    document
      .getElementById("requiredScore")
      .textContent =
      required + "点";

    document
      .getElementById("requiredPercent")
      .textContent =
      percent.toFixed(1) + "%";

  }

  result.style.display = "block";
}

</script>

</body>
